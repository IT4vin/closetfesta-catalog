<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Closet Festa</title>
  <desc id="desc">Banner genérico da loja Closet Festa</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9C2F45" />
      <stop offset="50%" stop-color="#B84A62" />
      <stop offset="100%" stop-color="#7A2436" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#bg)" rx="48" />
  <g fill="#FFFFFF">
    <text x="120" y="190" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="72" font-weight="700" letter-spacing="4">
      CLOSET FESTA
    </text>
    <text x="120" y="245" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="26" opacity="0.86">
      Aluguel de vestidos para ocasiões especiais
    </text>
  </g>
</svg>

