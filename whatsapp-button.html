<style>
  /* ── Contêiner do botão ── */
  .wa-float {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    font-family: 'Segoe UI', sans-serif;
  }

  /* ── Balão de texto ── */
  .wa-bubble {
    background: #fff;
    color: #1a1a1a;
    font-size: 13.5px;
    line-height: 1.4;
    padding: 10px 14px;
    border-radius: 16px 16px 4px 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,.13);
    max-width: 220px;
    opacity: 0;
    transform: translateY(8px) scale(.95);
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  .wa-bubble span {
    display: block;
    font-weight: 600;
    color: #25D366;
    margin-bottom: 2px;
  }

  /* ── Botão principal ── */
  .wa-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #25D366;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 18px rgba(37,211,102,.45);
    transition: transform .2s ease, box-shadow .2s ease;
    position: relative;
  }
  .wa-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 24px rgba(37,211,102,.6);
  }
  .wa-btn svg {
    width: 32px;
    height: 32px;
  }

  /* ── Pulso animado ── */
  .wa-btn::before,
  .wa-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(37, 211, 102, 0.35);
    animation: waPulse 2.4s ease-out infinite;
  }
  .wa-btn::after {
    animation-delay: 1.2s;
  }
  @keyframes waPulse {
    0%   { transform: scale(1);   opacity: .7; }
    100% { transform: scale(2.2); opacity: 0;  }
  }

  /* ── Mostrar balão no hover ── */
  .wa-float:hover .wa-bubble {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* ── Entrada inicial do botão ── */
  @keyframes waSlideIn {
    from { opacity: 0; transform: translateY(40px) scale(.8); }
    to   { opacity: 1; transform: translateY(0)   scale(1);   }
  }
  .wa-float {
    animation: waSlideIn .6s cubic-bezier(.34,1.56,.64,1) .8s both;
  }
</style>
